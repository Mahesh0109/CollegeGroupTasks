<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Seat Booking</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #87cefa;
        margin: 0;
        padding: 0;
      }

      .main-wrapper {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        margin: 20px auto;
        max-width: 1200px;
      }

      .poster-container {
        flex: 0 0 30%;
        margin-right: 20px;
        text-align: center;
      }

      .poster {
        width: 100%;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      }

      .container {
        flex: 0 0 65%;
        text-align: center;
        background-color: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      }

      h1 {
        margin-bottom: 20px;
      }

      .screen {
        background-color: #fff;
        height: 100px;
        width: 100%;
        margin-bottom: 15px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.7);
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      .row {
        display: flex;
        justify-content: center;
        margin-bottom: 10px;
      }

      .seat {
        background-color: #444451;
        height: 30px;
        width: 30px;
        margin: 5px;
        border-radius: 5px;
        cursor: pointer;
      }

      .seat.selected {
        background-color: #6feaf6;
      }

      .seat.occupied {
        background-color: #fff;
        cursor: not-allowed;
      }

      .btn {
        padding: 10px 20px;
        margin: 10px;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s ease, transform 0.2s ease;
      }

      .btn-cancel {
        background-color: #f44336;
        color: white;
      }

      .btn-cancel:hover {
        background-color: #d32f2f;
        transform: scale(1.05);
      }

      .btn-pay {
        background-color: #4caf50;
        color: white;
      }

      .btn-pay:hover {
        background-color: #388e3c;
        transform: scale(1.05);
      }

      .btn:hover {
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      }

      .text {
        margin-top: 30px;
        font-size: 18px;
      }

      .movie-info {
        margin-top: 10px;
        text-align: center;
        font-size: 18px;
      }

      .movie-info p {
        margin: 5px;
        font-size: 16px;
        font-weight: bold;
      }

      .movie-info .movie-title {
        font-size: 22px;
        color: #333;
        font-weight: bold;
        margin-bottom: 10px;
      }

      .movie-info .actor-director {
        font-size: 18px;
        color: #777;
        margin-bottom: 5px;
      }
      .movie-info .movie-music {
        font-size: 18px;
        color: #777;
        margin-bottom: 5px;
      }

      #thank-you-message {
        text-align: center;
        background-color: #f1f1f1;
        padding: 20px;
        border-radius: 10px;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="main-wrapper">
      <!-- Poster Section -->
      <div class="poster-container">
        <img
          src="https://assets.gadgets360cdn.com/pricee/assets/product/202404/Mirai1_1713782244.jpg"
          class="poster"
        />
        <div class="movie-info">
          <p class="movie-title">Mirai</p>
          <p class="actor-director">Actor: Teja Sajja</p>
          <p class="actor-director">Director: Karthik Gattamneni</p>
          <p class="movie-music">Co-Actor: Manoj Kumar Manchu</p>
        </div>
      </div>

      <div class="container">
        <h1>Movie Seat Booking</h1>
        <div class="screen">Screen</div>
        <div class="movie" id="movie" data-price="1000">Mirai (₹300)</div>

        <div class="row">
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
        </div>
        <div class="row">
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
        </div>
        <div class="row">
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
        </div>
        <div class="row">
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
        </div>
        <div class="row">
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
        </div>
        <div class="row">
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
          <div class="seat"></div>
        </div>

        <div>
          <button id="cancel" class="btn btn-cancel">Cancel</button>
          <button id="pay" class="btn btn-pay">Pay</button>
        </div>

        <p class="text">
          You have selected <span id="count">0</span> seats for a price of ₹
          <span id="total">0</span>.
        </p>
      </div>
    </div>

    <!-- Thank You Message Section -->
    <div id="thank-you-message" style="display: none">
      <h2>Thank you for booking!</h2>
      <p>Your booking has been confirmed. Enjoy the movie!</p>
    </div>

   <script>
      const container = document.querySelector(".container");
      const seats = document.querySelectorAll(".row .seat:not(.occupied)");
      const count = document.getElementById("count");
      const total = document.getElementById("total");
      const movie = document.getElementById("movie");

      const ticketPrice = +movie.getAttribute("data-price");

      function updateSelectedCount() {
        const selectedSeats = document.querySelectorAll(".row .seat.selected");
        const selectedSeatsCount = selectedSeats.length;

        count.innerText = selectedSeatsCount;
        total.innerText = selectedSeatsCount * ticketPrice;
      }

      container.addEventListener("click", (e) => {
        if (
          e.target.classList.contains("seat") &&
          !e.target.classList.contains("occupied")
        ) {
          e.target.classList.toggle("selected");
          updateSelectedCount();
        }
      });

      document.getElementById("pay").addEventListener("click", () => {
        const selectedSeatsCount = document.querySelectorAll(
          ".row .seat.selected"
        ).length;

        if (selectedSeatsCount > 0) {
          const totalAmount = selectedSeatsCount * ticketPrice;
          const discount = totalAmount * 0.1;
          const discountedAmount = totalAmount - discount;

         
          const thankYouMessage = document.createElement("div");
          thankYouMessage.style.backgroundColor = "#f0f8ff";
          thankYouMessage.style.border = "1px solid #4caf50";
          thankYouMessage.style.borderRadius = "10px";
          thankYouMessage.style.padding = "20px";
          thankYouMessage.style.marginTop = "20px";
          thankYouMessage.style.boxShadow = "0 4px 8px rgba(0, 0, 0, 0.9)";
          thankYouMessage.style.textAlign = "center";
          thankYouMessage.style.fontFamily = "Arial, sans-serif";

          thankYouMessage.innerHTML = `
      <h2 style="color: #4caf50;">Booking Confirmed!</h2>
      <p style="font-size: 18px;">Seats Booked: <strong>${selectedSeatsCount}</strong></p>
       <p style="font-size: 18px;">Original Amount: ₹${totalAmount.toFixed(
         2
       )}</p>
      <p style="font-size: 18px;">Festival Discount(10%): ₹${discount.toFixed(
        2
      )}</p>
      <p style="font-size: 18px;">Amount Paid: <strong>₹${discountedAmount.toFixed(
        2
      )}</strong></p>
    `;

          document.body.appendChild(thankYouMessage);

          container.style.display = "none";
        } else {
          const errorMessage = document.createElement("div");
          errorMessage.style.backgroundColor = "#f8d7da";
          errorMessage.style.color = "#721c24";
          errorMessage.style.border = "1px solid #f5c6cb";
          errorMessage.style.borderRadius = "5px";
          errorMessage.style.padding = "10px";
          errorMessage.style.marginTop = "10px";
          errorMessage.style.textAlign = "center";
          errorMessage.textContent =
            "Please select at least one seat before paying!";
          container.parentElement.insertBefore(errorMessage, container);

          setTimeout(() => {
            errorMessage.remove();
          }, 3000);
        }
      });
   </script>
  </body>
</html>
