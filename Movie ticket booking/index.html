<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Booking</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Joan&display=swap");

      /* Reset and Base Styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Joan", serif;
      }

      a {
        text-decoration: none;
        color: #adadad;
      }

      img {
        max-width: 100%;
        height: auto;
      }

      .btn {
        display: inline-block;
        padding: 0.5rem 1rem;
        background-color: #cd8c38;
        border-radius: 2rem;
        color: #1e1f26;
        transition: 0.3s;
      }

      .btn:hover {
        background-color: #92601f;
      }

      .btn-l {
        width: 100%;
        text-align: center;
      }

      /* Body and Grid Layout */
      body {
        background-color: #1e1f26;
        display: grid;
        grid-template-columns: minmax(320px, 1000px);
        justify-content: center;
        padding: 1rem;
      }

      .top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1.5rem 1rem;
      }

      .left-content,
      .right-content {
        display: flex;
        align-items: center;
      }

      .title {
        margin-right: 3rem;
        color: #cd8c38;
      }

      .navigation {
        display: flex;
        list-style: none;
        flex-wrap: wrap;
      }

      .navigation li {
        margin-right: 1rem;
      }

      .navigation li a:hover {
        color: #cd8c38;
      }

      .active {
        color: #cd8c38;
      }

      .filter,
      .cart,
      .help,
      .menu {
        position: relative;
        width: 20px;
        height: 20px;
      }

      .filter,
      .cart,
      .help {
        margin-right: 1rem;
      }

      .menu {
        margin-left: 0.8rem;
      }

      .filter,
      .menu {
        display: none;
      }

      .profile-img-box {
        position: relative;
        height: 30px;
        width: 30px;
        border-radius: 50%;
        overflow: hidden;
      }

      .upcoming-img-box {
        position: relative;
        height: 300px;
        width: 100%;
        border-radius: 1rem;
        overflow: hidden;
        margin-bottom: 1.5rem;
      }

      .upcoming-title {
        position: absolute;
        top: 2rem;
        left: 2rem;
        color: #cd8c38;
        background-color: #1e1f26;
        padding: 0.5rem 1rem;
        border-radius: 2rem;
        border: 1px solid #cd8c38;
        font-weight: 500;
      }

      .buttons {
        position: absolute;
        bottom: 2rem;
        left: 2rem;
      }

      .btn-alt {
        background-color: #1e1f26;
        color: #cd8c38;
        border: 1px solid #cd8c38;
        margin-left: 1rem;
      }

      .btn-alt:hover {
        color: #1e1f26;
        background-color: #cd8c38;
      }

      .movies-container {
        padding-bottom: 2rem;
      }

      .current-movies {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1.5rem;
      }

      .current-movie {
        background: linear-gradient(
          45deg,
          rgba(255, 255, 255, 0.05),
          rgba(205, 140, 56, 0.15)
        );
        padding: 1rem;
        border-radius: 0.5rem;
      }

      .cm-img-box {
        position: relative;
        height: 150px;
        margin-bottom: 1rem;
        border-radius: 0.5rem;
        overflow: hidden;
      }

      .movie-title {
        color: #fff;
        margin-bottom: 0.2rem;
      }

      .booking {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 1rem;
      }

      .price {
        color: #cd8c38;
      }

      .screen-name {
        color: bisque;
      }

      /* Responsive Styles */
      @media (max-width: 768px) {
        .top-bar {
          flex-direction: column;
          align-items: flex-start;
        }

        .left-content {
          margin-bottom: 1rem;
        }

        .navigation {
          flex-wrap: wrap;
        }

        .navigation li {
          margin-bottom: 0.5rem;
        }

        .upcoming-img-box {
          height: 200px;
        }

        .buttons .btn {
          margin-bottom: 0.5rem;
        }
      }

      @media (max-width: 480px) {
        .profile-img-box {
          height: 20px;
          width: 20px;
        }
      }
    </style>
  </head>
  <body>
    <section class="top-bar">
      <div class="left-content">
        <h2 class="title">Book Chey Machaa</h2>
        <ul class="navigation">
          <li><a class="active" href="#">Movies</a></li>
          <li><a class="active" href="https://mahesh0109.github.io/CollegeGroupTasks/Movie%20ticket%20booking/upcoming.html">More Upcoming Movies</a></li>
        </ul>
      </div>
      <div class="right-content">
        <img
          src="https://img.icons8.com/?size=100&id=z8yqcMdq4T2h&format=png&color=000000"
          alt="notify me"
          class="cart"
        />
        <div class="profile-img-box">
          <img
            src="https://img.icons8.com/?size=100&id=Qny75QHowUnU&format=png&color=000000"
            alt=""
          />
        </div>
      </div>
    </section>
    <div class="movies-container">
      <div class="upcoming-img-box">
        <img
          src="https://m.media-amazon.com/images/M/MV5BMmQzNDM4ZTAtYmRhYi00YTM5LTkwZWYtZTA1YWUzMWRlOGI5XkEyXkFqcGc@._V1_.jpg"
          alt=""
        />
        <p class="upcoming-title">Upcoming Movie</p>
        <div class="buttons">
          <a href="https://mahesh0109.github.io/CollegeGroupTasks/Movie%20ticket%20booking/hariharaveramallu.html" class="btn"
            >Book Now</a
          >
          <a href="https://youtu.be/4TriF7BfHyI" target="_blank" class="btn-alt btn">Play Trailer</a>
        </div>
      </div>
      <div class="current-movies">
        <div class="current-movie">
          <div class="cm-img-box">
            <img
              src="https://th-i.thgim.com/public/entertainment/movies/xdfbca/article67742797.ece/alternates/FREE_1200/rajasaab.jpg"
              alt=""
            />
          </div>
          <h3 class="movie-title">Rajasaab</h3>
          <p class="screen-name">Screen: Diamond</p>
          <div class="booking">
            <h2 class="price">550₹</h2>
            <a href="https://mahesh0109.github.io/CollegeGroupTasks/Movie%20ticket%20booking/Rajasaab.html" class="btn">Buy Tickets</a>
          </div>
        </div>
        <div class="current-movie">
          <div class="cm-img-box">
            <img
              src="https://i.ytimg.com/vi/PT0lYT4O9tQ/hq720.jpg?sqp=-oaymwEhCK4FEIIDSFryq4qpAxMIARUAAAAAGAElAADIQj0AgKJD&rs=AOn4CLBSoWe4GI-mXyQvWEduV_wA-hJ7Jw"
              alt=""
            />
          </div>
          <h3 class="movie-title">Hit-III</h3>
          <p class="screen-name">Screen: Gold</p>
          <div class="booking">
            <h2 class="price">400₹</h2>
            <a href="https://mahesh0109.github.io/CollegeGroupTasks/Movie%20ticket%20booking/Hit-III.html" class="btn">Buy Tickets</a>
          </div>
        </div>
        <div class="current-movie">
          <div class="cm-img-box">
            <img
              src="https://preview.redd.it/mirai-poster-v0-cje7ubj5faud1.png?width=640&crop=smart&auto=webp&s=4264a2daa5e11220dc5134e69f63bc0942d4836e"
              alt=""
            />
          </div>
          <h3 class="movie-title">Mirai</h3>
          <p class="screen-name">Screen: Silver</p>
          <div class="booking">
            <h2 class="price">300₹</h2>
            <a href="https://mahesh0109.github.io/CollegeGroupTasks/Movie%20ticket%20booking/mirai.html" class="btn">Buy Tickets</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
