      h1 {
        color: #ffcc00;
        text-align: center;
        font-family: "Courier New", Courier, monospace;
        font-size: 3rem;
        text-shadow: 2px 2px 5px #000;
        margin-bottom: 30px;
      }
      .container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        padding: 20px;
      }
      .card {
        background-color: #333;
        padding: 10px;
        border-radius: 10px;
        text-align: center;
        max-width: 300px;
        margin-bottom: 20px;
      }
      .card img {
        max-width: 80%;
        height: auto;
        border-radius: 20px;
        cursor: pointer;
      }
      .card button {
        margin-top: 10px;
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        font-size: 16px;
      }
      .card button:hover {
        background-color: #0056b3;
      }
    </style>
