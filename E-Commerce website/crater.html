<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        font-family: "Lato", sans-serif;
      }

      .bg-img {
        position: relative;
        width: 100%;
        height: 100vh;
        background: url("http://unsplash.it/1200x800") center center no-repeat;
        background-size: cover;
      }

      .bg-img::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: linear-gradient(to bottom right, #002f4b, #dc4225);
        opacity: 0.6;
        z-index: 1;
      }

      .content {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        text-align: center;
        color: white;
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 20px;
      }

      .product {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        background: rgba(255, 255, 255, 0.9);
        padding: 20px;
        border-radius: 10px;
        color: #333;
      }

      .product img {
        width: 350px;
        height: 350px;
        margin-right: 20px;
        border-radius: 8px;
      }

      .product-details {
        flex: 1;
        text-align: left;
        font-size: 1.2rem;
      }

      .product-details input {
        margin: 10px 7;
        padding: 8px;
        width: 50px;
        background-color: #fff;
      }

      .product-details button {
        background: #4caf50;
        color: white;
        padding: 10px 15px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 1rem;
      }

      .product-details button:hover {
        background: #45a049;
      }

      .cart {
        margin-top: 30px;
        padding: 20px;
        background: #fff;
        color: #000;
        border: 1px solid #ddd;
        border-radius: 8px;
      }

      .cart-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        padding: 10px;
        border-bottom: 1px solid #ddd;
      }

      .cart-item img {
        width: 50px;
        height: 50px;
        margin-right: 10px;
      }

      .cart-item-details {
        display: flex;
        align-items: center;
        font-size: 1.2rem;
        color: #333;
        margin-right: 20px;
        margin-left: 20px;
        flex: 1;
      }

      .cart-item-title {
        margin-right: 20px;
      }

      .cart-actions button {
        margin: 0 5px;
        padding: 5px 10px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      .cart-actions .remove {
        background-color: #f44336;
        color: white;
      }
      .cart-actions .remove:hover {
        background-color: #dc4225;
      }
      @media screen and (max-width: 768px) {
  .product {
    flex-direction: column;
    text-align: center;
  }

  .product img {
    width: 100%;
    height: auto;
    margin: 0 auto 20px;
  }

  .product-details {
    text-align: center;
  }

  .cart-item {
    flex-direction: column;
    text-align: center;
  }

  .cart-item img {
    margin-bottom: 10px;
  }

  .cart-item-details {
    flex-direction: column;
    align-items: center;
    margin: 0;
  }

  .cart-item-title,
  .cart-item-quantity,
  .cart-item-price {
    margin: 5px 0;
  }
}

@media screen and (max-width: 480px) {
  h1 {
    font-size: 1.8rem;
  }

  h3 {
    font-size: 1.5rem;
  }

  .product-details button {
    padding: 8px 12px;
    font-size: 0.9rem;
  }

  .cart-actions button {
    font-size: 0.8rem;
    padding: 5px 8px;
  }
}

    </style>
  </head>
  <body>
    <div class="bg-img">
      <div class="content">
        <h1>SHOPPING CART</h1>

        <div class="product">
          <img src="https://i.imgur.com/hAorHyy.png" alt="Product Image" />
          <div class="product-details">
            <h3>CRATER</h3>
            <p>Price: 899₹</p>
            <p>Available in Green and White colors</p>
            <input type="number" min="1" value="1" id="product-quantity" />
            <button
              class="custom-btn btn-5"
              onclick="addToCart('Air Force', 899, 'https://i.imgur.com/hAorHyy.png')"
            >
              ADD TO CART!
            </button>
          </div>
        </div>

        <!-- Cart Section -->
        <div class="cart">
          <h2>Your Cart</h2>
          <div id="cart-items">Products appear here</div>
        </div>
      </div>
    </div>

    <script>
      const cartItemsContainer = document.getElementById("cart-items");

      function addToCart(title, price, image) {
        const quantity = parseInt(
          document.getElementById("product-quantity").value
        );

        // Create cart item
        const cartItem = document.createElement("div");
        cartItem.classList.add("cart-item");

        cartItem.innerHTML = `
        <div class="cart-item-details">
          <img src="${image}" alt="${title}">
          <span class="cart-item-title">${title}</span>
          <span class="cart-item-quantity">Qty: ${quantity}</span>
          <span class="cart-item-price">  ₹${(price * quantity).toFixed(
            2
          )}</span>
        </div>
        <div class="cart-actions">
          <button class="remove" onclick="removeItem(this)">Remove</button>
        </div>
      `;

        cartItemsContainer.appendChild(cartItem);
      }

      function removeItem(button) {
        const cartItem = button.closest(".cart-item");
        cartItem.remove();
      }
    </script>
  </body>
</html>
